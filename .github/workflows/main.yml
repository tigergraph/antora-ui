name: CI

# On pull requests: lint and build the UI bundle so a broken gulp/bundle
# cannot merge. The zip is not committed from PRs.
#
# On push to main: rebuild build/ui-bundle.zip from source, commit it back
# if it changed, then ping Netlify once so docs sites that consume
# https://github.com/tigergraph/antora-ui/blob/main/build/ui-bundle.zip?raw=true
# pick up the new bundle. The zip commit uses [skip ci] and is ignored by
# the Netlify step so that second push cannot start a second docs deploy.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# PRs: cancel superseded runs. Main: queue so two merges cannot publish
# ui-bundle.zip at the same time (the zip is a binary and cannot rebase).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Node 17+ dropped PostCSS 8.1's "./" exports fallback, which broke
      # gulp-stylelint 13 / postcss-syntax. CSS lint now uses stylelint 14.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build UI bundle
        run: npx gulp bundle

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: ui-bundle
          path: build/ui-bundle.zip
          if-no-files-found: error

      # Do not rebase ui-bundle.zip: it is binary, so a concurrent main
      # commit that also touches the zip would conflict. Fetch latest main,
      # rebuild if the branch moved, then commit and retry the push.
      - name: Publish bundle to main
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "published=false" >> "$GITHUB_OUTPUT"

          git fetch origin main

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ] || [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "Rebuilding the bundle from origin/main (attempt ${attempt})"
              git reset --hard origin/main
              npm ci --no-audit
              npx gulp bundle
            fi

            git add build/ui-bundle.zip
            if git diff --cached --quiet; then
              echo "UI bundle unchanged; nothing to commit."
              exit 0
            fi

            git commit -m "build(ui): rebuild UI bundle from source [skip ci]"
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}); retrying against latest main"
            git fetch origin main
          done

          echo "Failed to publish ui-bundle.zip after retries" >&2
          exit 1

      # One Netlify deploy per UI change: only after a new zip is on main.
      # Do not ping for PRs, the [skip ci] zip commit, or github-actions[bot]
      # (that second push would otherwise rebuild the docs site again).
      - name: Trigger Netlify build hook
        if: >
          github.ref == 'refs/heads/main' &&
          github.actor != 'github-actions[bot]' &&
          !contains(github.event.head_commit.message, '[skip ci]') &&
          (github.event_name == 'workflow_dispatch' || steps.publish.outputs.published == 'true')
        run: |
          echo "Making curl call to Netlify build hook"
          curl -X POST -d '{}' "${{ secrets.BUILD_HOOK }}"
